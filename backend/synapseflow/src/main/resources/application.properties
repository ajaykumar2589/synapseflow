# ===============================
# APPLICATION METADATA
# ===============================
spring.application.name=synapseflow
server.port=8080

# ===============================
# DATABASE CONNECTION (MySQL in Docker)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/synapseflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# 'update' automatically creates/updates our database tables based on our Java Entities
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries in the console 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true