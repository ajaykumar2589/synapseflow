# ===============================
# APPLICATION METADATA
# ===============================
spring.application.name=synapseflow
server.port=8080
# --- JWT Security Configuration ---
# This is a secure 256-bit Hex key. Never share this in production!
jwt.secret=${JWT_SECRET}
# Expiration time: 1 Day in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration=86400000
# ===============================
# DATABASE CONNECTION (MySQL in Docker)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:synapseflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# 'update' automatically creates/updates our database tables based on our Java Entities
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries in the console 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- Spring AI & Gemini Configuration ---
# We inject the key via an Environment Variable so it NEVER goes to GitHub
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.5-flash
